<section class="card green">
  <div class="icon">👥</div>
  <div class="content">
    <h2>Liste des amis</h2>

    <div class="inputs">
      @for (item of friends(); track item.id) {
        <input type="text" [(ngModel)]="item.name" />
      }
    </div>

    <ul>
      @for (item of friends(); track item.id) {
        <li>{{ item.name }}</li>
      } @empty {
        <li>Aucun ami</li>
      }
    </ul>
  </div>
</section>
